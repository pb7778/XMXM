<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AB PLC L5X 可视化诊断与去锁 (V5.0)</title>
    <style>
        body { font-family: "Consolas", "Monaco", monospace; background: #1e1e1e; color: #d4d4d4; margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .title { font-size: 20px; color: #4ec9b0; font-weight: bold; }
        
        .controls { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .btn-blue { background: #007acc; color: white; }
        .btn-yellow { background: #dcdcaa; color: #1e1e1e; }
        .btn-green { background: #4CAF50; color: white; display: none; } /* 默认隐藏 */
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* 编辑区域 */
        #editor { 
            flex: 1; background: #252526; color: #d4d4d4; border: 1px solid #3e3e42; 
            padding: 15px; font-size: 13px; line-height: 1.5; resize: none; outline: none; white-space: pre; overflow: auto;
            font-family: "Consolas", monospace;
        }

        /* 密码展示区 */
        #keyPanel {
            background: #2d2b55; color: #fad000; padding: 10px; margin-bottom: 10px; 
            border-radius: 4px; display: none; word-break: break-all; font-size: 12px; border: 1px solid #555;
        }

        .status-bar { margin-top: 10px; font-size: 13px; color: #aaa; display: flex; justify-content: space-between; background: #333; padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="header">
    <div class="title">🔓 AB PLC 源码可视化诊疗</div>
    <div class="controls">
        <button class="btn btn-blue" onclick="document.getElementById('fileInput').click()">1. 打开文件</button>
        <button class="btn btn-yellow" onclick="toggleEncoding()">2. 乱码点我 (切换编码)</button>
        <button class="btn btn-green" id="downloadBtn" onclick="saveFile()">3. 下载无锁文件</button>
    </div>
    <input type="file" id="fileInput" accept=".L5X,.l5x,.L5K,.l5k" style="display:none">
</div>

<div id="keyPanel">
    <strong>🔑 提取到的原始密钥 (Encrypted Hash):</strong><br>
    <span id="keyContent">...</span>
</div>

<textarea id="editor" placeholder="说明：&#10;1. 点击“打开文件”选择您的 L5X。&#10;2. 此时如果您看到全是方块或乱码，请务必点击上方黄色的“切换编码”按钮！&#10;3. 直到您能清晰看到 &lt;Routine Name=... 这种代码。&#10;4. 工具会自动识别并提取密码，随后点击绿色按钮下载。" spellcheck="false"></textarea>

<div class="status-bar">
    <div id="status">等待文件...</div>
    <div id="info"></div>
</div>

<script>
    const editor = document.getElementById('editor');
    const statusDiv = document.getElementById('status');
    const infoDiv = document.getElementById('info');
    const keyPanel = document.getElementById('keyPanel');
    const keyContent = document.getElementById('keyContent');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentFile = null;
    let fileBuffer = null;
    let isUTF16 = false; // 默认先试 UTF-8

    // 1. 读取文件
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        currentFile = file;
        
        const reader = new FileReader();
        reader.readAsArrayBuffer(file);
        reader.onload = (e) => {
            fileBuffer = e.target.result;
            // 简单的智能预判：检查前1000字节里的0的数量
            const u8 = new Uint8Array(fileBuffer);
            let nullCount = 0;
            for(let i=0; i<Math.min(1000, u8.length); i++) if(u8[i]===0) nullCount++;
            
            // 如果0很多，或者是BOM头，自动切到 UTF-16
            if ((nullCount > 200) || (u8[0]===0xFF && u8[1]===0xFE)) {
                isUTF16 = true;
            } else {
                isUTF16 = false;
            }
            renderText();
        };
    });

    // 2. 渲染文本 (核心：让用户能看到)
    function renderText() {
        if (!fileBuffer) return;
        try {
            const decoder = new TextDecoder(isUTF16 ? 'utf-16le' : 'utf-8');
            const text = decoder.decode(fileBuffer);
            editor.value = text;
            
            statusDiv.innerHTML = `当前编码: <span style="color:${isUTF16?'#4CAF50':'#007acc'}">${isUTF16 ? 'UTF-16 LE' : 'UTF-8'}</span>`;
            
            // 每次渲染完立刻分析
            analyzeAndUnlock(text);
        } catch (e) {
            editor.value = "解码错误，请点击“切换编码”重试。";
        }
    }

    // 3. 切换编码按钮
    function toggleEncoding() {
        if (!fileBuffer) return;
        isUTF16 = !isUTF16; // 切换状态
        renderText();
    }

    // 4. 分析、提取密码、去锁
    function analyzeAndUnlock(text) {
        // 重置界面
        keyPanel.style.display = 'none';
        downloadBtn.style.display = 'none';
        infoDiv.innerHTML = "";

        // 匹配所有可能的锁类型 (包括 AOI 的 Signature)
        const regex = /(SourceKey|SourceProtection|SourceContext|SignatureID|EncryptionSignature)\s*[:]?=\s*(["'])([\s\S]*?)\2/gi;
        const match = regex.exec(text);
        
        if (match) {
            const lockType = match[1];
            const lockHash = match[3];

            // 1. 显示密码
            keyPanel.style.display = 'block';
            keyContent.innerText = lockHash;
            
            // 2. 提示信息
            infoDiv.innerHTML = `✅ 发现锁: <b>${lockType}</b> | 已自动移除，请下载`;
            infoDiv.style.color = "#4CAF50";

            // 3. 在编辑器里直接把锁删掉 (为了下载做准备)
            const newText = text.replace(regex, "");
            editor.value = newText; // 更新编辑器内容为无锁版
            downloadBtn.style.display = 'block';

        } else {
            // 没找到锁，进行诊断
            if (text.includes("<EncodedData>")) {
                infoDiv.innerHTML = `❌ 警告: 发现 <b>&lt;EncodedData&gt;</b> (这是二进制编译保护，无法还原源码)`;
                infoDiv.style.color = "#ff5252";
            } else if (text.indexOf("Routine") === -1 && text.indexOf("<?xml") === -1) {
                infoDiv.innerHTML = `⚠️ 文字看起来像乱码？请点击上方黄色的 <b>[切换编码]</b> 按钮！`;
                infoDiv.style.color = "#dcdcaa";
            } else {
                infoDiv.innerHTML = `ℹ️ 文件格式正常，但未发现加密关键字。`;
            }
        }
    }

    // 5. 保存下载
    function saveFile() {
        if (!editor.value) return;
        const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        
        // 智能文件名
        let name = "Unlocked.L5X";
        if (currentFile) {
            name = currentFile.name.replace(/\.(l5x|L5X)/, "_Unlocked.L5X");
        }
        link.download = name;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
