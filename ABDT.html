<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AB PLC 密钥提取与解锁工具2 (V3 终极版)</title>
    <style>
        body { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.7); width: 650px; border: 1px solid #333; max-width: 95%; }
        h2 { color: #00e676; margin-top: 0; text-align: center; border-bottom: 2px solid #333; padding-bottom: 20px; letter-spacing: 1px; }
        
        .drop-area { 
            border: 2px dashed #444; background: #252526; padding: 40px; margin: 20px 0; 
            border-radius: 8px; cursor: pointer; text-align: center; transition: 0.2s; color: #888; font-size: 16px;
        }
        .drop-area:hover { border-color: #00e676; color: #fff; background: #2d2d30; }
        .drop-area.highlight { border-color: #00e676; background: #2a2a2a; }

        /* 密钥显示区 - 满足您看密码的需求 */
        .key-display {
            background: #2d2b55; border: 1px solid #7d57ff; color: #d6deeb; padding: 15px;
            border-radius: 5px; margin-bottom: 15px; display: none; word-break: break-all;
            font-family: Consolas, monospace; font-size: 13px; text-align: left;
        }
        .key-label { color: #c792ea; font-weight: bold; display: block; margin-bottom: 8px; border-bottom: 1px solid #7d57ff; padding-bottom: 5px; }

        /* 日志框 */
        .log-window { 
            background: #000; color: #ccc; font-family: Consolas, monospace; font-size: 12px; 
            padding: 15px; border-radius: 4px; height: 120px; overflow-y: auto; 
            margin-bottom: 20px; border: 1px solid #333; white-space: pre-wrap; text-align: left;
        }

        .btn { 
            background: linear-gradient(135deg, #00c853 0%, #009624 100%); color: white; border: none; padding: 15px; 
            font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; display: none; width: 100%; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .footer { font-size: 12px; color: #666; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔐 AB PLC 智能密钥提取/解锁 V3</h2>
    
    <div class="drop-area" id="dropZone">
        📂 点击选择或拖入 .L5X 文件<br>
        <span style="font-size:12px; color:#aaa; margin-top:5px; display:block">(内置智能编码识别，支持 UTF-8 / UTF-16)</span>
    </div>
    <input type="file" id="fileInput" accept=".L5X,.l5x,.L5K,.l5k" style="display:none">
    
    <div id="keyOutput" class="key-display">
        <span class="key-label">🔍 提取到的原始密钥 (Encrypted Hash):</span>
        <span id="keyText" style="color:#addb67;"></span>
    </div>

    <div class="log-window" id="logBox">系统就绪...</div>
    
    <button id="dlBtn" class="btn">⬇️ 下载已解锁文件 (导入即可打开)</button>
    
    <div class="footer">
        原理说明：此工具会自动识别文件编码，提取加密哈希并直接移除 "SourceKey" 属性。<br>
        下载后的文件实际上已变为“无密码”状态，直接导入 Studio 5000 即可。
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const logBox = document.getElementById('logBox');
    const dlBtn = document.getElementById('dlBtn');
    const keyOutput = document.getElementById('keyOutput');
    const keyText = document.getElementById('keyText');
    
    let processedContent = null, originalName = "";

    function log(msg, color = '#ccc') {
        const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
        logBox.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    // 交互逻辑
    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => loadFile(e.target.files[0]);
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('highlight'); };
    dropZone.ondragleave = (e) => { e.preventDefault(); dropZone.classList.remove('highlight'); };
    dropZone.ondrop = (e) => { 
        e.preventDefault(); 
        dropZone.classList.remove('highlight'); 
        loadFile(e.dataTransfer.files[0]); 
    };

    function loadFile(file) {
        if (!file) return;
        
        // 重置状态
        logBox.innerHTML = "";
        dlBtn.style.display = 'none';
        keyOutput.style.display = 'none';
        originalName = file.name;
        
        log(`正在加载: ${file.name} (${(file.size/1024).toFixed(2)} KB)...`, '#fff');

        const reader = new FileReader();
        
        // 【核心修复】使用 ArrayBuffer 读取，彻底解决 UTF-16 乱码导致无法识别的问题
        reader.readAsArrayBuffer(file);
        
        reader.onload = (e) => {
            try {
                const buffer = e.target.result;
                let content = "";
                
                // 1. 智能检测编码
                const uint8Array = new Uint8Array(buffer);
                let encoding = "utf-8";
                
                // 检测 BOM 或 Null 字节模式
                if (uint8Array[0] === 0xFF && uint8Array[1] === 0xFE) {
                    encoding = "utf-16le";
                    log("检测到编码: UTF-16 LE (带BOM)", '#e6db74');
                } else {
                    // 扫描前1000字节，如果包含大量0，说明是无BOM的UTF-16
                    let nullCount = 0;
                    for(let i=0; i<Math.min(1000, uint8Array.length); i++) {
                        if(uint8Array[i] === 0) nullCount++;
                    }
                    if(nullCount > 200) {
                        encoding = "utf-16le";
                        log("检测到编码: UTF-16 LE (无BOM)", '#e6db74');
                    } else {
                        log("检测到编码: UTF-8 / ASCII", '#e6db74');
                    }
                }

                // 2. 解码文本
                const decoder = new TextDecoder(encoding);
                content = decoder.decode(buffer);
                
                // 3. 正则匹配加密锁 (兼容旧版 SourceKey 和 新版 SourceProtection)
                const regex = /(SourceKey|SourceProtection|SourceContext)\s*=\s*(["'])([\s\S]*?)\2/gi;
                
                let match = regex.exec(content);
                
                if (match) {
                    const lockType = match[1]; // Key 或 Protection
                    const lockHash = match[3]; // 引号里的内容
                    
                    log(`✅ 成功定位加密信息！类型: ${lockType}`, '#00e676');
                    
                    // 显示提取到的 Key（这就是那个网站读取的原始数据）
                    keyOutput.style.display = 'block';
                    keyText.textContent = lockHash.substring(0, 150) + (lockHash.length > 150 ? "..." : "");
                    
                    if(lockHash.length > 50) {
                        log("提示: 检测到长哈希，已准备暴力移除。", '#888');
                    }

                    // 4. 执行移除操作
                    // 使用 replace 全部替换为空
                    processedContent = content.replace(regex, "");
                    
                    dlBtn.style.display = 'block';
                    log("🔓 文件已解锁！点击下方绿色按钮下载。", '#fff');
                } else {
                    log("❌ 未发现加密关键字。", '#ff5252');
                    log("诊断: 文件解码正常，但未找到 SourceKey 属性。", '#888');
                    log("可能原因: 导出的是整个工程而非 Routine？请确认您是右键Routine导出的L5X。", '#888');
                }

            } catch (err) {
                log("程序错误: " + err.message, '#ff5252');
            }
        };
    }

    dlBtn.onclick = () => {
        // 输出时统一转换为 UTF-8，兼容性最好
        const blob = new Blob([processedContent], { type: 'text/xml;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        
        let namePart = originalName.substring(0, originalName.lastIndexOf('.'));
        // 保持原扩展名
        let ext = originalName.substring(originalName.lastIndexOf('.')); 
        link.download = namePart + '_Unlocked' + ext;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };
</script>

</body>
</html>
